name: Apply participant leave fix

on:
  push:
    branches:
      - agent/public-room-lifecycle-fix
    paths:
      - tools/apply_participant_leave_fix.py
      - .github/workflows/apply-participant-leave-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-room-lifecycle-fix
          fetch-depth: 0
      - run: python3 tools/apply_participant_leave_fix.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'm_role != Role::None' src/P2PManager.cpp
          grep -q 'room.clients.delete(participant.playerId);' server/signaling/server.ts
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/P2PManager.cpp server/signaling/server.ts
          git commit -m "fix: remove guests from signaling roster on leave"
          git push origin HEAD:agent/public-room-lifecycle-fix
