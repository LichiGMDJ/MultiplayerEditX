name: Apply performance patch to UI branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-layout-polish
          fetch-depth: 0
      - name: Apply patch
        run: python .ci/perf_sync_patch.py
      - name: Validate source
        run: |
          grep -F 'kMaxBulkPacketsPerPeerPerTick = 8' src/P2PManager.cpp
          grep -F 'std::chrono::seconds(3)' src/P2PManager.cpp
          grep -F 'spawnedById' src/RemoteActionHandler.cpp
          grep -F 'queued authoritative snapshot immediately' src/EditorHooks.cpp
          grep -F 'fetchRooms(false);' src/ui/RoomDiscoveryPopups.cpp
          grep -F 'HOST_DIRECTORY_STALE_MS = 45_000' server/signaling/server.ts
          deno check server/signaling/server.ts
      - name: Commit branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EditorHooks.cpp src/P2PManager.cpp src/RemoteActionHandler.cpp src/ui/RoomDiscoveryPopups.hpp src/ui/RoomDiscoveryPopups.cpp server/signaling/server.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'perf: accelerate initial sync and room discovery [perf-sync-applied]'
          git push origin HEAD:ui-layout-polish
