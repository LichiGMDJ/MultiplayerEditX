name: Apply Room Browser Integration

on:
  push:
    branches:
      - v053-room-browser
    paths:
      - tools/room-browser.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v053-room-browser
      - name: Apply room browser patch
        run: python tools/apply_room_browser.py
      - name: Verify signaling server
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check server/signaling/server.ts
      - name: Commit source changes
        run: |
          git config user.name "LichiGMDJ"
          git config user.email "aleksandrrubacev222@gmail.com"
          git add src server .github/workflows/multi-platform-release.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: restore room browser, privacy and passwords"
          git push origin HEAD:v053-room-browser
