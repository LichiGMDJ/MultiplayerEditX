name: Apply sync fastfix

on:
  push:
    branches:
      - agent/sync-fastfix
    paths:
      - tools/apply_sync_fastfix.py
      - .github/workflows/apply-sync-fastfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-fastfix
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/apply_sync_fastfix.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'kMaxBulkPacketsPerPeerPerTick = 8' src/P2PManager.cpp
          grep -q 'queued authoritative snapshot for player' src/EditorHooks.cpp
          grep -q 'nearest serialized position' src/RemoteActionHandler.cpp
          grep -q 'obj->setPosition({objData.x, objData.y})' src/RemoteActionHandler.cpp

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/P2PManager.cpp src/EditorHooks.cpp src/RemoteActionHandler.cpp
          git commit -m "fix: restore fast ordered level sync"
          git push origin HEAD:agent/sync-fastfix
