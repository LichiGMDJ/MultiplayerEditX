name: Apply sync mapping fastpath

on:
  push:
    branches:
      - agent/sync-fastfix
    paths:
      - tools/apply_sync_mapping_fastpath.py
      - .github/workflows/apply-sync-mapping-fastpath.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-fastfix
          fetch-depth: 0

      - name: Apply O(N) snapshot mapping fastpath
        run: python3 tools/apply_sync_mapping_fastpath.py

      - name: Validate source
        run: |
          git diff --check
          grep -q 'candidatesByPosition.reserve(newObjs.size())' src/RemoteActionHandler.cpp
          grep -q 'std::llround' src/RemoteActionHandler.cpp
          grep -q 'match->setPosition({expectedX, expectedY})' src/RemoteActionHandler.cpp

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/RemoteActionHandler.cpp
          git commit -m "perf: index snapshot UUID mapping"
          git push origin HEAD:agent/sync-fastfix
