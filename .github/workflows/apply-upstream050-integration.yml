name: Apply Upstream 0.5.0 Integration

on:
  push:
    branches:
      - v053-upstream050-integration
    paths:
      - tools/upstream050-integration.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v053-upstream050-integration
          fetch-depth: 0
      - name: Apply integration
        run: |
          python3 -m py_compile tools/integrate_upstream050.py
          python3 tools/integrate_upstream050.py
      - name: Validate generated sources
        run: |
          python3 tools/verify_upstream050_integration.py
          git diff --check
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mod.json src/net/NetworkConfig.hpp src/net/NetworkConfig.cpp src/P2PManager.cpp server/signaling/server.ts .github/workflows/integration-build.yml tools/verify_upstream050_integration.py
          git commit -m 'feat: integrate stable 0.5.0 lifecycle with selectable transports' || exit 0
          git push origin v053-upstream050-integration
