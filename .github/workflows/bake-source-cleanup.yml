name: Bake Final Source Cleanup

on:
  push:
    branches:
      - mod-id-lichigmdj
    paths:
      - .github/workflows/bake-source-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bake generated source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_turn_udp.py
          python scripts/patch_external_editor_sync.py
          python scripts/patch_bulk_paste_sync.py
          python scripts/patch_bulk_transport_queue.py
          python scripts/patch_reliable_editor_retry.py
          python scripts/patch_reliable_transport_queue.py
          python scripts/patch_processing_remote_guard.py
          python scripts/patch_ack_integrity_reconnect.py
          python scripts/patch_ack_integrity_reconnect_hardening.py
          python scripts/patch_integrity_compile_fix.py
          python scripts/patch_handshake_finalize.py
          python scripts/patch_initial_sync_always_full.py
          python scripts/patch_initial_sync_request.py

      - name: Validate baked v0.5.3 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'kProtocolVersion = 7' src/P2PManager.cpp
          grep -q 'encodeLayerTaggedUuid' src/EditorHooks.cpp
          grep -q 'objectLayerSyncState' src/EditorHooks.cpp
          grep -q 'decodeLayerTaggedUuid' src/RemoteActionHandler.cpp
          grep -q 'applyEditorLayers(match, tagged.editorLayer, tagged.editorLayer2)' src/RemoteActionHandler.cpp
          grep -q 'Must remain last. A callback reached from here may destroy the popup' src/ui/MultiplayerPopup.cpp

      - name: Remove patch infrastructure and legacy build dump
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch_*.py
          rm -rf scripts/__pycache__
          rm -rf MultiplayerEdit-LEGACY-0.3.0
          rm -f .github/workflows/bake-source-cleanup.yml

          # These markers only existed to satisfy old patch-driven workflow checks.
          sed -i '/legacy workflow marker:/d' src/P2PManager.cpp
          sed -i '/legacy workflow marker:/d' src/EditorHooks.cpp
          sed -i '/legacy workflow marker:/d' src/RemoteActionHandler.cpp

      - name: Commit baked source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LichiGMDJ"
          git config user.email "aleksandrrubacev222@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Bake v0.5.3 source and remove patch infrastructure"
          git push origin HEAD:mod-id-lichigmdj
