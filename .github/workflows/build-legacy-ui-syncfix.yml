name: Build legacy UI syncfix

on:
  push:
    branches:
      - agent/legacy-ui-sync-roomfix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-ui-sync-roomfix
          fetch-depth: 0
      - name: Apply backend-only sync patch
        run: python3 tools/apply_legacy_sync_fastfix.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'kMaxBulkPacketsPerPeerPerTick = 8' src/P2PManager.cpp
          grep -q 'queued authoritative snapshot for player' src/EditorHooks.cpp
          grep -q 'candidatesByPosition.reserve(newObjs.size())' src/RemoteActionHandler.cpp
          git diff --name-only | grep -q '^src/EditorHooks.cpp$'
          git diff --name-only | grep -q '^src/P2PManager.cpp$'
          git diff --name-only | grep -q '^src/RemoteActionHandler.cpp$'
          if git diff --name-only | grep -q '^src/ui/'; then
            echo 'UI file changed unexpectedly'
            exit 1
          fi
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/EditorHooks.cpp src/P2PManager.cpp src/RemoteActionHandler.cpp
          git commit -m "fix: backport ordered sync fixes to legacy UI"
          git push origin HEAD:agent/legacy-ui-sync-roomfix

  build:
    runs-on: windows-latest
    needs: patch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-ui-sync-roomfix
      - name: Verify legacy UI remains intact
        shell: bash
        run: |
          grep -q 'patreon-button' src/ui/MultiplayerPopup.cpp
          grep -q 'Support future development:' src/ui/MultiplayerPopup.cpp
          grep -q 'kMaxBulkPacketsPerPeerPerTick = 8' src/P2PManager.cpp
          grep -q 'queued authoritative snapshot for player' src/EditorHooks.cpp
          grep -q 'candidatesByPosition.reserve(newObjs.size())' src/RemoteActionHandler.cpp
      - name: Build Win64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.7.1
          target: Win64
          build-config: Release
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          combine: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: legacy-ui-syncfix-win64
          path: ${{ steps.build.outputs.build-output }}
