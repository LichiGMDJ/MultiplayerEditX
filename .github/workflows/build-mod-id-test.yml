name: Build Mod ID Test

on:
  push:
    branches:
      - mod-id-lichigmdj
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify TURN secret is available
        shell: pwsh
        env:
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TURN_PASSWORD)) {
            throw "TURN_PASSWORD repository secret is missing"
          }
          Write-Host "TURN_PASSWORD loaded successfully (length=$($env:TURN_PASSWORD.Length))"

      - name: Patch self-hosted signaling and TURN/UDP
        env:
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
        run: python scripts/patch_turn_udp.py

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.7.1
          target: Win64
          build-config: Release
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichigmdj.multiplayereditx
          path: ${{ steps.build.outputs.build-output }}
