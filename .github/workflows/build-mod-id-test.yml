name: Build Mod ID Test

on:
  push:
    branches:
      - mod-id-lichigmdj
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate patch scripts
        run: |
          python -m py_compile scripts/patch_turn_udp.py
          python -m py_compile scripts/patch_external_editor_sync.py
          python -m py_compile scripts/patch_bulk_paste_sync.py
          python -m py_compile scripts/patch_bulk_transport_queue.py
          python -m py_compile scripts/patch_reliable_editor_retry.py
          python -m py_compile scripts/patch_reliable_transport_queue.py
          python -m py_compile scripts/patch_processing_remote_guard.py
          python -m py_compile scripts/patch_ack_integrity_reconnect.py
          python -m py_compile scripts/patch_ack_integrity_reconnect_hardening.py
          python -m py_compile scripts/patch_integrity_compile_fix.py
          python -m py_compile scripts/patch_handshake_finalize.py
          python -m py_compile scripts/patch_initial_sync_always_full.py

      - name: Apply 0.5.1 safety patch
        run: python scripts/patch_turn_udp.py

      - name: Apply external editor compatibility patch
        run: python scripts/patch_external_editor_sync.py

      - name: Apply finalized bulk paste patch
        run: python scripts/patch_bulk_paste_sync.py

      - name: Apply paced bulk transport patch
        run: python scripts/patch_bulk_transport_queue.py

      - name: Apply reliable editor retry patch
        run: python scripts/patch_reliable_editor_retry.py

      - name: Apply strict reliable FIFO patch
        run: python scripts/patch_reliable_transport_queue.py

      - name: Apply remote-processing RAII guard
        run: python scripts/patch_processing_remote_guard.py

      - name: Apply ACK integrity reconnect layer
        run: python scripts/patch_ack_integrity_reconnect.py

      - name: Harden ACK integrity reconnect layer
        run: python scripts/patch_ack_integrity_reconnect_hardening.py

      - name: Apply integrity compile interface fix
        run: python scripts/patch_integrity_compile_fix.py

      - name: Gate peer readiness on protocol handshake
        run: python scripts/patch_handshake_finalize.py

      - name: Force authoritative initial level sync
        run: python scripts/patch_initial_sync_always_full.py

      - name: Verify patched source markers
        shell: pwsh
        run: |
          $p2p = Get-Content src/P2PManager.cpp -Raw
          $p2pHeader = Get-Content src/P2PManager.hpp -Raw
          $protoHeader = Get-Content src/BinaryProtocol.hpp -Raw
          $hooks = Get-Content src/EditorHooks.cpp -Raw
          $remote = Get-Content src/RemoteActionHandler.cpp -Raw
          $remoteHeader = Get-Content src/RemoteActionHandler.hpp -Raw
          $actionHeader = Get-Content src/ActionSerializer.hpp -Raw
          $cursor = Get-Content src/ui/CursorNode.cpp -Raw

          if (-not $p2p.Contains("kSafeMessageBytes = 24 * 1024")) { throw "paced SCTP packet size missing" }
          if (-not $p2p.Contains("kMaxInboundMessageBytes")) { throw "inbound packet guard missing" }
          if (-not $p2p.Contains("kProtocolVersion = 2")) { throw "protocol v2 guard missing" }
          if (-not $p2p.Contains("serializeProtocolHello")) { throw "protocol hello send missing" }
          if (-not $p2p.Contains("replaying {} buffered packets")) { throw "pre-handshake replay logic missing" }
          if (-not $p2p.Contains("flushBulkReliableQueues")) { throw "reliable FIFO drain missing" }
          if (-not $p2p.Contains("queueTrackedReliable")) { throw "tracked reliable enqueue missing" }
          if (-not $p2p.Contains("ReliableEnvelope")) { throw "reliable envelope path missing" }
          if (-not $p2p.Contains("ReliableAck")) { throw "ACK path missing" }
          if (-not $p2p.Contains("RETRY #")) { throw "ACK timeout retry missing" }
          if (-not $p2p.Contains("duplicate #")) { throw "reliable dedup missing" }
          if (-not $p2p.Contains("scheduleClientReconnect")) { throw "client reconnect scheduler missing" }
          if (-not $p2p.Contains("classified as reconnect")) { throw "host reconnect classification missing" }
          if (-not $p2p.Contains("reconnect response had no playerId")) { throw "reconnect malformed-response retry missing" }
          if (-not $p2p.Contains("LevelRepairRequest")) { throw "integrity control relay guard missing" }
          if (-not $p2p.Contains("finalizePeerHandshake")) { throw "protocol-gated peer finalize missing" }
          if (-not $p2p.Contains("waiting for protocol handshake")) { throw "transport-ready/protocol-ready split missing" }
          if (-not $p2p.Contains("releasing {} pending messages")) { throw "pending release after handshake missing" }
          if (-not $p2pHeader.Contains("connectionAnnounced")) { throw "single peer announcement guard missing" }
          if (-not $p2pHeader.Contains("pendingReliableAcks")) { throw "pending ACK state missing" }
          if (-not $p2pHeader.Contains("receivedReliableSequences")) { throw "dedup state missing" }
          if (-not $p2pHeader.Contains("protocolVerified")) { throw "peer protocol verification state missing" }
          if (-not $p2pHeader.Contains("preHandshakeMessages")) { throw "pre-handshake packet buffer missing" }
          if (-not $protoHeader.Contains("ProtocolHello")) { throw "ProtocolHello opcode missing" }
          if (-not $protoHeader.Contains("LevelDigest")) { throw "level digest protocol missing" }
          if (-not $protoHeader.Contains("LevelManifest")) { throw "level manifest protocol missing" }
          if (-not $protoHeader.Contains("LevelRepairRequest")) { throw "targeted repair protocol missing" }
          if (-not $protoHeader.Contains("FullResyncRequest")) { throw "full resync fallback protocol missing" }
          if ($p2p.Contains("openrelay.metered.ca")) { throw "old public TURN relay still present after patch" }
          if (-not $hooks.Contains("MAX_CHUNK_BYTES = 12000")) { throw "safe full-level sync chunk bytes missing" }
          if (-not $hooks.Contains("MAX_UUIDS_PER_CHUNK = 250")) { throw "safe full-level UUID chunk size missing" }
          if (-not $hooks.Contains("m_integrityCheckTimer")) { throw "periodic integrity timer missing" }
          if (-not $hooks.Contains("authoritative initial sync_level")) { throw "authoritative initial full sync missing" }
          if ($hooks.Contains("waiting for digest before repair/resync")) { throw "reconnect still skips initial SyncLevel" }
          if (-not $hooks.Contains("sendFullLevelSyncTo")) { throw "full SyncLevel fallback helper missing" }
          if (-not $hooks.Contains(":music:")) { throw "player music status suffix missing" }
          if (-not $hooks.Contains("m_externalCompatScanTimer")) { throw "external editor compatibility scan missing" }
          if (-not $hooks.Contains("externally-created objects")) { throw "external placement reconciliation missing" }
          if (-not $hooks.Contains("externally-deleted objects")) { throw "external deletion reconciliation missing" }
          if (-not $hooks.Contains("s_inBulkPasteSync")) { throw "bulk paste guard missing" }
          if (-not $hooks.Contains("pasteObjects(gd::string")) { throw "EditorUI pasteObjects hook missing" }
          if (-not $hooks.Contains("bulk paste synced")) { throw "finalized bulk paste send missing" }
          if (-not $remote.Contains("stableIntegrityHash")) { throw "stable level hash missing" }
          if (-not $remote.Contains("kA21")) { throw "StartPos hash normalization missing" }
          if (-not $remote.Contains("LEVEL HASH mismatch")) { throw "digest comparison missing" }
          if (-not $remote.Contains("targeted repair requested")) { throw "targeted repair logic missing" }
          if (-not $remote.Contains("full SyncLevel requested")) { throw "full resync handler missing" }
          if (-not $remoteHeader.Contains("#include <utility>")) { throw "integrity API standard include missing" }
          if (-not $actionHeader.Contains("parseSaveStringOrdered")) { throw "ordered save-string helper declaration missing" }
          if (-not $actionHeader.Contains("buildSaveStringOrdered")) { throw "ordered save-string builder declaration missing" }
          if (-not $remote.Contains("struct ProcessingRemoteGuard")) { throw "remote-processing RAII guard missing" }
          if (-not $remote.Contains("ProcessingRemoteGuard processingRemoteGuard")) { throw "remote handlers are not guarded" }
          if (-not $cursor.Contains("LevelTools::getSongObject")) { throw "custom song title lookup missing" }
          if (-not $cursor.Contains("LevelTools::getAudioTitle")) { throw "official song title lookup missing" }

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.7.1
          target: Win64
          build-config: Release
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichigmdj.multiplayereditx-0.5.1-rc
          path: ${{ steps.build.outputs.build-output }}
