name: Apply Room Lifecycle Cleanup Fix With Deno

on:
  push:
    branches: [ui-layout-polish]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[room-lifecycle-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-layout-polish
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply canonical room lifecycle patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-room-lifecycle.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply room lifecycle fixes\n        shell: python\n        run: |\n'
          tail = '\n      - name: Validate source invariants\n'
          block = workflow.split(marker, 1)[1].split(tail, 1)[0]
          exec(textwrap.dedent(block), {})

      - name: Validate source and server
        run: |
          grep -F 'const HOST_DIRECTORY_STALE_MS = 75_000;' server/signaling/server.ts
          grep -F 'directoryNow - room.host.lastSeenAt <= HOST_DIRECTORY_STALE_MS' server/signaling/server.ts
          grep -F 'Explicit host leave/delete is authoritative' server/signaling/server.ts
          grep -F 'type: "client_left"' server/signaling/server.ts
          grep -F 'signaling reports graceful leave for player' src/P2PManager.cpp
          grep -F 'Room closed by host' src/P2PManager.cpp
          grep -F 'Tell signaling first, while the peer connections are still alive.' src/P2PManager.cpp
          deno check server/signaling/server.ts

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/signaling/server.ts src/P2PManager.cpp
          git commit -m "fix: close and prune signaling rooms correctly [room-lifecycle-applied]"
          git push origin HEAD:ui-layout-polish
