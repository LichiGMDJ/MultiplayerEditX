name: Apply Room Lifecycle Cleanup Fix

on:
  push:
    branches: [ui-layout-polish]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[room-lifecycle-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-layout-polish
          fetch-depth: 0

      - name: Apply room lifecycle fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          # ---------------- signaling server ----------------
          path = Path("server/signaling/server.ts")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              'const ROOM_TTL_MS = 2 * 60 * 60 * 1000;\nconst LONG_POLL_MS = 25_000;',
              'const ROOM_TTL_MS = 2 * 60 * 60 * 1000;\n// Hosts continuously long-poll signaling, so a host that has not touched the\n// server for this window is no longer safe to advertise in the public list.\n// The room itself may remain temporarily so an existing client can request\n// host migration after an unexpected disconnect.\nconst HOST_DIRECTORY_STALE_MS = 75_000;\nconst LONG_POLL_MS = 25_000;',
              "host directory stale constant"
          )

          text = replace_once(
              text,
              '''function removeExpiredRooms(): void {\n  const cutoff = now() - ROOM_TTL_MS;\n  for (const [code, room] of rooms) {\n    if (room.lastActivityAt < cutoff) rooms.delete(code);\n  }\n\n  const rateCutoff = now() - 5 * 60_000;''',
              '''function removeExpiredRooms(): void {\n  const current = now();\n  const cutoff = current - ROOM_TTL_MS;\n  for (const [code, room] of rooms) {\n    const hostStale = current - room.host.lastSeenAt > HOST_DIRECTORY_STALE_MS;\n    if (room.lastActivityAt < cutoff || (hostStale && room.clients.size === 0)) {\n      rooms.delete(code);\n    }\n  }\n\n  const rateCutoff = current - 5 * 60_000;''',
              "expired room cleanup"
          )

          text = replace_once(
              text,
              '''  if (req.method === "GET" && path === "/rooms") {\n    const publicRooms = [...rooms.values()]\n      .filter((room) => !room.isPrivate)''',
              '''  if (req.method === "GET" && path === "/rooms") {\n    const directoryNow = now();\n    const publicRooms = [...rooms.values()]\n      .filter((room) =>\n        !room.isPrivate &&\n        directoryNow - room.host.lastSeenAt <= HOST_DIRECTORY_STALE_MS\n      )''',
              "public directory stale host filter"
          )

          old_delete = '''    if (req.method === "DELETE" && parts.length === 2) {\n      const token = bearerToken(req);\n      if (!token || token !== room.host.token) return json({ error: "host token required" }, 403);\n\n      const winner = electMigrationHost(room);\n      if (!winner) {\n        rooms.delete(roomCode);\n        return json({ ok: true, closed: true });\n      }\n\n      promoteHost(room, winner);\n      return json({\n        ok: true,\n        closed: false,\n        migrated: true,\n        generation: room.generation,\n      });\n    }'''
          new_delete = '''    if (req.method === "DELETE" && parts.length === 2) {\n      const token = bearerToken(req);\n      const participant = findParticipant(room, token);\n      if (!participant) return json({ error: "unauthorized" }, 401);\n\n      if (participant.token === room.host.token) {\n        // Explicit host leave/delete is authoritative. Host migration is only\n        // for an unexpected host loss handled through POST /migrate.\n        rooms.delete(roomCode);\n        console.log(`[room] closed room=${roomCode} host=${room.host.playerName}`);\n        return json({ ok: true, closed: true });\n      }\n\n      // Clients also unregister from signaling on a graceful leave so public\n      // player counts and future migration candidates do not retain ghosts.\n      const leavingId = participant.playerId;\n      room.clients.delete(leavingId);\n      room.lastActivityAt = now();\n      enqueue(room.host, {\n        type: "client_left",\n        playerId: leavingId,\n        generation: room.generation,\n      });\n      console.log(`[room] client left room=${roomCode} player=${leavingId}`);\n      return json({ ok: true, closed: false, left: true });\n    }'''
          text = replace_once(text, old_delete, new_delete, "explicit room close semantics")
          path.write_text(text, encoding="utf-8")

          # ---------------- C++ client ----------------
          path = Path("src/P2PManager.cpp")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '''            } else if (type == "answer") {''',
              '''            } else if (type == "client_left") {\n                int clientId = msg.get<int>("playerId").unwrapOr(-1);\n                if (m_role == Role::Host && clientId > 0) {\n                    log::info("P2PManager: signaling reports graceful leave for player {}", clientId);\n                    onPeerDisconnected(clientId, false);\n                }\n            } else if (type == "answer") {''',
              "client_left signaling message"
          )

          text = replace_once(
              text,
              '''                if (!res.ok()) {\n                    log::warn("P2PManager: migration endpoint returned {}; reconnect fallback", res.code());\n                    scheduleClientReconnect();\n                    return;\n                }''',
              '''                if (!res.ok()) {\n                    if (res.code() == 404 || res.code() == 410) {\n                        log::info("P2PManager: migration stopped because room no longer exists");\n                        m_reconnectScheduled.store(false);\n                        m_state.store(State::Error);\n                        queueInMainThread([this]() {\n                            for (auto& cb : m_onError) cb("Room closed by host");\n                        });\n                        return;\n                    }\n                    log::warn("P2PManager: migration endpoint returned {}; reconnect fallback", res.code());\n                    scheduleClientReconnect();\n                    return;\n                }''',
              "closed room migration handling"
          )

          text = replace_once(
              text,
              '''                } else if (res.code() == 401 || res.code() == 403 || res.code() == 404) {\n                    log::warn("P2PManager: HTTP relay poll stopped with {}", res.code());\n                    m_httpRelayPollingActive.store(false);\n                    return;''',
              '''                } else if (res.code() == 404) {\n                    log::info("P2PManager: HTTP relay room no longer exists");\n                    m_httpRelayPollingActive.store(false);\n                    if (m_role == Role::Client) {\n                        m_state.store(State::Error);\n                        queueInMainThread([this]() {\n                            for (auto& cb : m_onError) cb("Room closed by host");\n                        });\n                    }\n                    return;\n                } else if (res.code() == 401 || res.code() == 403) {\n                    log::warn("P2PManager: HTTP relay poll stopped with {}", res.code());\n                    m_httpRelayPollingActive.store(false);\n                    return;''',
              "relay room closed handling"
          )

          old_leave = '''    void P2PManager::leaveSession() {\n        stopSignalPolling();\n        stopHttpRelayPolling();\n\n        {\n            std::lock_guard lock(m_peersMutex);\n            for (auto& [id, peer] : m_peers) {\n                if (peer.reliable) peer.reliable->close();\n                if (peer.unreliable) peer.unreliable->close();\n                if (peer.pc) peer.pc->close();\n            }\n            m_peers.clear();\n        }\n\n        if (m_role == Role::Host && !m_roomCode.empty()) {\n            auto url = getSignalingUrl() + "/rooms/" + m_roomCode;\n            auto req = web::WebRequest();\n            if (!m_signalingToken.empty()) {\n                req.header("Authorization", "Bearer " + m_signalingToken);\n            }\n            async::spawn(req.send("DELETE", url));\n        }'''
          new_leave = '''    void P2PManager::leaveSession() {\n        stopSignalPolling();\n        stopHttpRelayPolling();\n\n        // Tell signaling first, while the peer connections are still alive.\n        // This prevents a graceful host leave racing a client's /migrate call.\n        // DELETE is also used by clients to unregister their directory record.\n        if (m_role != Role::None && !m_roomCode.empty() && !m_signalingToken.empty()) {\n            auto leavingRole = m_role;\n            auto leavingRoom = m_roomCode;\n            auto url = getSignalingUrl() + "/rooms/" + leavingRoom;\n            auto req = web::WebRequest();\n            req.header("Authorization", "Bearer " + m_signalingToken);\n            req.timeout(std::chrono::seconds(2));\n            async::spawn(\n                req.send("DELETE", url),\n                [leavingRole, leavingRoom](web::WebResponse res) {\n                    if (res.ok()) {\n                        log::info(\n                            "P2PManager: signaling leave accepted room={} role={}",\n                            leavingRoom,\n                            leavingRole == Role::Host ? "host" : "client"\n                        );\n                    } else if (res.code() != 404) {\n                        log::warn(\n                            "P2PManager: signaling leave failed room={} code={} error={}",\n                            leavingRoom, res.code(), res.errorMessage()\n                        );\n                    }\n                }\n            );\n        }\n\n        {\n            std::lock_guard lock(m_peersMutex);\n            for (auto& [id, peer] : m_peers) {\n                if (peer.reliable) peer.reliable->close();\n                if (peer.unreliable) peer.unreliable->close();\n                if (peer.pc) peer.pc->close();\n            }\n            m_peers.clear();\n        }'''
          text = replace_once(text, old_leave, new_leave, "signaling-first leaveSession")
          path.write_text(text, encoding="utf-8")

      - name: Validate source invariants
        run: |
          grep -F 'const HOST_DIRECTORY_STALE_MS = 75_000;' server/signaling/server.ts
          grep -F 'directoryNow - room.host.lastSeenAt <= HOST_DIRECTORY_STALE_MS' server/signaling/server.ts
          grep -F 'Explicit host leave/delete is authoritative' server/signaling/server.ts
          grep -F 'type: "client_left"' server/signaling/server.ts
          grep -F 'signaling reports graceful leave for player' src/P2PManager.cpp
          grep -F 'Room closed by host' src/P2PManager.cpp
          grep -F 'Tell signaling first, while the peer connections are still alive.' src/P2PManager.cpp
          grep -F 'm_role != Role::None && !m_roomCode.empty() && !m_signalingToken.empty()' src/P2PManager.cpp
          deno check server/signaling/server.ts

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/signaling/server.ts src/P2PManager.cpp
          git commit -m "fix: close and prune signaling rooms correctly [room-lifecycle-applied]"
          git push origin HEAD:ui-layout-polish
