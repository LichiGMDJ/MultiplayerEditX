name: Apply Session Visuals and Music Fixes

on:
  push:
    branches: [ui-layout-polish]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[session-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-layout-polish
          fetch-depth: 0

      - name: Apply lifecycle and music fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          # CursorNode: deterministic immediate cleanup, including playtest icons.
          path = Path("src/ui/CursorNode.hpp")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''        static CursorNode* create();\n        \n        static cocos2d::ccColor3B getColorForIndex(int index);''',
              '''        static CursorNode* create();\n\n        // Remove every remote visual immediately. This is intentionally public\n        // so SessionManager can clean the editor even while the pause layer has\n        // suspended CursorNode::update().\n        void clearRemoteVisuals();\n        \n        static cocos2d::ccColor3B getColorForIndex(int index);''',
              "CursorNode public cleanup"
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/ui/CursorNode.cpp")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''    void CursorNode::update(float dt) {\n        auto& session = SessionManager::get();\n        \n        if (!session.isInSession()) {\n            this->removeAllChildren();\n            m_cursors.clear();\n            m_selectionDrawNode = nullptr; // Since removeAllChildren deleted it\n            return;\n        }''',
              '''    void CursorNode::clearRemoteVisuals() {\n        for (auto& [playerId, cursor] : m_cursors) {\n            (void)playerId;\n            if (cursor.drawNode) cursor.drawNode->removeFromParent();\n            if (cursor.label) cursor.label->removeFromParent();\n            if (cursor.toolIndicator) cursor.toolIndicator->removeFromParent();\n            if (cursor.playtestIcon) cursor.playtestIcon->removeFromParent();\n            if (cursor.playtestIcon2) cursor.playtestIcon2->removeFromParent();\n        }\n        m_cursors.clear();\n        if (m_selectionDrawNode) m_selectionDrawNode->clear();\n        log::debug("CursorNode: cleared all remote cursor/player visuals");\n    }\n\n    void CursorNode::update(float dt) {\n        auto& session = SessionManager::get();\n        \n        if (!session.isInSession()) {\n            clearRemoteVisuals();\n            return;\n        }''',
              "CursorNode update cleanup"
          )
          path.write_text(text, encoding="utf-8")

          # SessionManager: clear visual + remote action state synchronously on leave.
          path = Path("src/SessionManager.cpp")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''#include "BinaryProtocol.hpp"\n#include <Geode/loader/Log.hpp>''',
              '''#include "BinaryProtocol.hpp"\n#include "ui/CursorNode.hpp"\n#include <Geode/loader/Log.hpp>''',
              "SessionManager CursorNode include"
          )
          text = replace_once(
              text,
              '''    void SessionManager::leaveSession() {\n        if (!isInSession()) return;\n\n        P2PManager::get().leaveSession();\n        \n        auto sessionEndedCallbacks = m_onSessionEnded;''',
              '''    void SessionManager::leaveSession() {\n        if (!isInSession()) return;\n\n        // The editor pause layer can suspend scheduled updates. Do not wait for\n        // CursorNode::update() to notice Role::None: remove remote cursors and\n        // playtest icons synchronously while the scene is still alive.\n        if (auto* editor = LevelEditorLayer::get()) {\n            if (editor->m_objectLayer) {\n                if (auto* cursor = typeinfo_cast<CursorNode*>(editor->m_objectLayer->getChildByID("cursor-node"_spr))) {\n                    cursor->clearRemoteVisuals();\n                }\n            }\n        }\n\n        P2PManager::get().leaveSession();\n        RemoteActionHandler::get().clearMappings();\n        \n        auto sessionEndedCallbacks = m_onSessionEnded;''',
              "SessionManager immediate cleanup"
          )
          path.write_text(text, encoding="utf-8")

          # EditorHooks: use GD's own level song display name as authoritative
          # metadata where possible, and reject cached "Unknown" placeholders.
          path = Path("src/EditorHooks.cpp")
          text = path.read_text(encoding="utf-8")
          marker = '''    std::string objectLayerSyncState(GameObject* obj, LevelEditorLayer* editor) {\n        if (!obj || !editor) return {};\n        auto state = std::string(obj->getSaveString(editor));\n        state += "|mpedit-editor-layers:" + std::to_string(obj->m_editorLayer)\n            + ":" + std::to_string(obj->m_editorLayer2);\n        return state;\n    }\n'''
          helper = marker + '''\n    bool isUsableMusicTitle(std::string const& value) {\n        if (value.empty()) return false;\n        std::string lower;\n        lower.reserve(value.size());\n        for (unsigned char ch : value) {\n            lower.push_back(static_cast<char>(std::tolower(ch)));\n        }\n        return lower != "unknown" && lower != "unknown song" &&\n            lower.find(" - unknown") == std::string::npos;\n    }\n\n    std::string resolveLevelMusicTitle(GJGameLevel* level) {\n        if (!level) return {};\n\n        std::string gdDisplayName = level->getSongName().c_str();\n\n        if (level->m_songID > 0) {\n            if (auto* song = LevelTools::getSongObject(level->m_songID)) {\n                std::string songName = song->m_songName.c_str();\n                std::string artistName = song->m_artistName.c_str();\n                if (isUsableMusicTitle(songName)) {\n                    return artistName.empty() ? songName : artistName + " - " + songName;\n                }\n            }\n            if (isUsableMusicTitle(gdDisplayName)) return gdDisplayName;\n            return "Song ID " + std::to_string(level->m_songID);\n        }\n\n        // For official tracks, GJGameLevel::getSongName() is the same display\n        // source Geometry Dash itself uses. Prefer it over lower-level cached\n        // audio metadata, which can temporarily report artist + Unknown.\n        if (isUsableMusicTitle(gdDisplayName)) return gdDisplayName;\n\n        std::string audioTitle = LevelTools::getAudioTitle(level->m_audioTrack).c_str();\n        if (isUsableMusicTitle(audioTitle)) return audioTitle;\n        return "Official song " + std::to_string(level->m_audioTrack);\n    }\n'''
          text = replace_once(text, marker, helper, "music title helper")

          text = replace_once(
              text,
              '''        bool m_musicBaselineReady = false;\n        float m_externalCompatScanTimer = 0.f;''',
              '''        bool m_musicBaselineReady = false;\n        std::string m_lastCursorMusicTitle;\n        float m_externalCompatScanTimer = 0.f;''',
              "music title diagnostic field"
          )

          old_music_change = '''                std::string title;\n                if (currentSong > 0) {\n                    if (auto* song = LevelTools::getSongObject(currentSong)) {\n                        title = std::string(song->m_artistName.c_str()) + " - " + std::string(song->m_songName.c_str());\n                    }\n                    if (title.empty()) title = "Song ID " + std::to_string(currentSong);\n                } else {\n                    title = LevelTools::getAudioTitle(currentTrack);\n                    if (title.empty()) title = "Official song " + std::to_string(currentTrack);\n                }'''
          text = replace_once(
              text,
              old_music_change,
              '''                std::string title = resolveLevelMusicTitle(this->m_level);''',
              "host MusicChanged title"
          )

          old_cursor_title = '''                std::string currentMusicTitle;\n                if (currentSongId > 0) {\n                    if (auto* song = LevelTools::getSongObject(currentSongId)) {\n                        std::string songName = song->m_songName.c_str();\n                        std::string artistName = song->m_artistName.c_str();\n                        if (!songName.empty()) {\n                            currentMusicTitle = artistName.empty() ? songName : artistName + " - " + songName;\n                        }\n                    }\n                    if (currentMusicTitle.empty()) currentMusicTitle = "Song ID " + std::to_string(currentSongId);\n                } else {\n                    currentMusicTitle = LevelTools::getAudioTitle(currentAudioTrack);\n                    if (currentMusicTitle.empty()) currentMusicTitle = "Official song " + std::to_string(currentAudioTrack);\n                }'''
          text = replace_once(
              text,
              old_cursor_title,
              '''                std::string currentMusicTitle = resolveLevelMusicTitle(this->m_level);\n                if (currentMusicTitle != m_fields->m_lastCursorMusicTitle) {\n                    log::info(\n                        "EditorHooks: cursor music label resolved to '{}' (songID={}, audioTrack={})",\n                        currentMusicTitle, currentSongId, currentAudioTrack\n                    );\n                    m_fields->m_lastCursorMusicTitle = currentMusicTitle;\n                }''',
              "cursor music title"
          )
          path.write_text(text, encoding="utf-8")

      - name: Validate fixes
        run: |
          grep -F 'void clearRemoteVisuals();' src/ui/CursorNode.hpp
          grep -F 'CursorNode: cleared all remote cursor/player visuals' src/ui/CursorNode.cpp
          grep -F 'cursor->clearRemoteVisuals();' src/SessionManager.cpp
          grep -F 'RemoteActionHandler::get().clearMappings();' src/SessionManager.cpp
          grep -F 'resolveLevelMusicTitle' src/EditorHooks.cpp
          grep -F 'level->getSongName()' src/EditorHooks.cpp
          grep -F "cursor music label resolved to" src/EditorHooks.cpp

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/CursorNode.hpp src/ui/CursorNode.cpp src/SessionManager.cpp src/EditorHooks.cpp
          git commit -m "fix: clean session visuals and resolve music titles [session-fix-applied]"
          git push origin HEAD:ui-layout-polish
