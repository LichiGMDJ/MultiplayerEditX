name: Build Upstream 0.5.0 Integration

on:
  workflow_dispatch:
  push:
    branches:
      - v053-upstream050-integration
    paths-ignore:
      - 'tools/integration-smoke.trigger'
      - 'tools/upstream050-integration.trigger'
      - '.github/workflows/apply-upstream050-integration.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify integration invariants
        run: |
          python3 tools/verify_upstream050_integration.py
          git diff --check
      - name: Typecheck signaling server
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check server/signaling/server.ts

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows64
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.9.0
          target: ${{ matrix.target }}
          build-config: Release
          android-min-sdk: 23
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          combine: true

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Combine Win64 + Android64
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main
      - uses: actions/upload-artifact@v4
        with:
          name: lichigmdj.multiplayereditx-0.5.3-upstream050-integration
          path: ${{ steps.combine.outputs.build-output }}
