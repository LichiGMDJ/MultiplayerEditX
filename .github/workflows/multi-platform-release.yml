name: Build Multiplayer Edit X

on:
  workflow_dispatch:
  push:
    branches:
      - mod-id-lichigmdj
    tags:
      - "v*"
  pull_request:
    branches:
      - mod-id-lichigmdj

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows64
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source architecture
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mod = json.loads(Path("mod.json").read_text(encoding="utf-8"))
          assert mod["id"] == "lichigmdj.multiplayereditx"
          assert mod["version"] == "0.5.3"

          p2p = Path("src/P2PManager.cpp").read_text(encoding="utf-8")
          hooks = Path("src/EditorHooks.cpp").read_text(encoding="utf-8")
          remote = Path("src/RemoteActionHandler.cpp").read_text(encoding="utf-8")
          capabilities = Path("src/net/ProtocolCapabilities.hpp").read_text(encoding="utf-8")
          adaptive = Path("src/sync/AdaptiveSyncPolicy.hpp").read_text(encoding="utf-8")
          signaling = Path("server/signaling/server.ts").read_text(encoding="utf-8")

          assert "kCurrentProtocol = 8" in capabilities
          assert "HostMigration" in capabilities
          assert "AdaptiveSync" in capabilities
          assert "SecureSignaling" in capabilities
          assert "serializeProtocolHello(net::kCurrentProtocol" in p2p
          assert "requestHostMigration" in p2p
          assert "AdaptiveSyncPolicy" in hooks
          assert "SYNC PERF" in hooks
          assert "encodeLayerTaggedUuid" in hooks
          assert "decodeLayerTaggedUuid" in remote
          assert "applyEditorLayers(match, tagged.layer1, tagged.layer2)" in remote
          assert "sessionToken" in signaling
          assert 'parts[2] === "migrate"' in signaling
          assert "194.226.126.115" not in p2p
          print("v0.5.3 architecture verification passed")
          PY

      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.7.1
          target: ${{ matrix.target }}
          build-config: Release
          android-min-sdk: 23
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          combine: true

  package:
    name: Package Win64 + Android64
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichigmdj.multiplayereditx-0.5.3
          path: ${{ steps.combine.outputs.build-output }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Multiplayer Edit X v0.5.3
          generate_release_notes: true
          files: ${{ steps.combine.outputs.build-output }}
