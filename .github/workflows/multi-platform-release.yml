name: Multi-Platform Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - mod-id-lichigmdj
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.config.name }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows64
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate patch scripts
        shell: bash
        run: |
          python -m py_compile scripts/patch_turn_udp.py
          python -m py_compile scripts/patch_external_editor_sync.py
          python -m py_compile scripts/patch_bulk_paste_sync.py
          python -m py_compile scripts/patch_bulk_transport_queue.py
          python -m py_compile scripts/patch_reliable_editor_retry.py
          python -m py_compile scripts/patch_reliable_transport_queue.py
          python -m py_compile scripts/patch_processing_remote_guard.py
          python -m py_compile scripts/patch_ack_integrity_reconnect.py
          python -m py_compile scripts/patch_ack_integrity_reconnect_hardening.py
          python -m py_compile scripts/patch_integrity_compile_fix.py
          python -m py_compile scripts/patch_handshake_finalize.py
          python -m py_compile scripts/patch_initial_sync_always_full.py
          python -m py_compile scripts/patch_initial_sync_request.py
          python -m py_compile scripts/patch_raw_bulk_anchor_bridge.py
          python -m py_compile scripts/patch_raw_bulk_paste_v3.py
          python -m py_compile scripts/patch_v4_relay_anchor_bridge.py
          python -m py_compile scripts/patch_global_shared_state_v4.py
          python -m py_compile scripts/patch_workshop_anchor_host_music_v5.py
          python -m py_compile scripts/patch_room_settings_v6.py
          python -m py_compile scripts/patch_room_settings_layout.py
          python -m py_compile scripts/patch_auto_ice_fallback.py
          python -m py_compile scripts/patch_v052_stability.py
          python -m py_compile scripts/patch_v052_hardening.py
          python -m py_compile scripts/patch_v052_ui_music.py
          python -m py_compile scripts/patch_v052_connection_diagnostics.py
          python -m py_compile scripts/patch_v053_editor_layers.py
          python -m py_compile scripts/patch_finalize_release.py

      - name: Apply base transport patch chain
        shell: bash
        run: |
          python scripts/patch_turn_udp.py
          python scripts/patch_external_editor_sync.py
          python scripts/patch_bulk_paste_sync.py
          python scripts/patch_bulk_transport_queue.py
          python scripts/patch_reliable_editor_retry.py
          python scripts/patch_reliable_transport_queue.py
          python scripts/patch_processing_remote_guard.py
          python scripts/patch_ack_integrity_reconnect.py
          python scripts/patch_ack_integrity_reconnect_hardening.py
          python scripts/patch_integrity_compile_fix.py
          python scripts/patch_handshake_finalize.py
          python scripts/patch_initial_sync_always_full.py

      - name: Apply Protocol v7 release chain
        shell: bash
        run: python scripts/patch_initial_sync_request.py

      - name: Verify release source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          mod = json.loads(Path('mod.json').read_text(encoding='utf-8'))
          assert mod.get('id') == 'lichigmdj.multiplayereditx', 'Unexpected mod ID'
          assert mod.get('name') == 'Multiplayer Edit X', 'Unexpected mod name'
          assert mod.get('version') == '0.5.3', 'Unexpected release version'
          assert mod.get('gd', {}).get('win') == '2.2081', 'Win64 GD target missing'
          assert mod.get('gd', {}).get('android') == '2.2081', 'Android64 GD target missing'

          p2p = Path('src/P2PManager.cpp').read_text(encoding='utf-8')
          proto = Path('src/BinaryProtocol.hpp').read_text(encoding='utf-8')
          hooks = Path('src/EditorHooks.cpp').read_text(encoding='utf-8')
          remote = Path('src/RemoteActionHandler.cpp').read_text(encoding='utf-8')
          action = Path('src/ActionSerializer.cpp').read_text(encoding='utf-8')
          cursor = Path('src/ui/CursorNode.cpp').read_text(encoding='utf-8')
          room = Path('src/ui/RoomSettingsPopup.cpp').read_text(encoding='utf-8')
          popup = Path('src/ui/MultiplayerPopup.cpp').read_text(encoding='utf-8')
          popup_hpp = Path('src/ui/MultiplayerPopup.hpp').read_text(encoding='utf-8')
          status = Path('src/ui/SessionStatusNode.cpp').read_text(encoding='utf-8')
          assert 'kProtocolVersion = 7' in p2p, 'Protocol v7 missing'
          assert 'ICE auto mode: direct/STUN preferred, TURN fallback available' in p2p, 'ICE auto mode missing'
          assert 'InitialSyncRequest' in proto, 'Initial sync protocol missing'
          assert 'RoomSettingsChanged' in proto, 'Room Settings protocol missing'
          assert 'm_integrityCheckTimer >= 20.0f' in hooks, 'v0.5.2 integrity interval missing'
          assert 'applying deferred SyncLevel after playtest ended' in hooks, 'deferred SyncLevel guard missing'
          assert 'Always register it before storing its full serialized state' in hooks, 'StartPos cache hardening missing'
          assert 'encodeLayerTaggedUuid' in hooks, 'v0.5.3 editor layer sidecar sender missing'
          assert 'objectLayerSyncState' in hooks, 'v0.5.3 layer-aware change detection missing'
          assert 'StartPos configuration is authoritative shared editor state' in action, 'StartPos serialization hardening missing'
          assert 'blocked guest music change and stopped unauthorized preview' in hooks, 'guest music containment missing'
          assert 'Prevent a guest-selected editor preview from leaking' in hooks, 'guest music exit cleanup missing'
          assert 'using targeted repair instead of automatic SyncLevel' in remote, 'non-destructive repair policy missing'
          assert 'SyncLevel deferred until playtest ends' in remote, 'playtest SyncLevel guard missing'
          assert 'rejected SyncLevelStart with unsafe bounds' in remote, 'snapshot bounds missing'
          assert 'refusing destructive SyncLevel because serialized object count' in remote, 'snapshot validation missing'
          assert 'snapshot mapping incomplete' in remote, 'robust UUID mapping missing'
          assert 'loadSettingsFromString(serializedObjects[i])' in remote, 'StartPos full-sync restoration missing'
          assert 'decodeLayerTaggedUuid' in remote, 'v0.5.3 editor layer sidecar receiver missing'
          assert 'applyEditorLayers(match, tagged.editorLayer, tagged.editorLayer2)' in remote, 'v0.5.3 full-sync layer restore missing'
          assert '|mpedit-editor-layers:' in remote, 'v0.5.3 layer-aware integrity hash missing'
          assert 'transmittedTitle' in cursor, 'cursor music title fix missing'
          assert 'constexpr float rightButtonX = 346.f' in room, 'Room Settings compact right column missing'
          assert 'maxButtonHalfGap = 34.f' in room, 'Max-player symmetric spacing missing'
          assert 'm_connectionElapsed' in popup_hpp, 'connection diagnostic state missing'
          assert 'Stage 1/4: Signaling - joining room' in popup, 'signaling stage missing'
          assert 'Stage 2/4: WebRTC - ICE / STUN / TURN negotiation' in popup, 'ICE stage missing'
          assert 'Stage 3/4: P2P connected - waiting for level sync' in popup, 'P2P sync stage missing'
          assert 'Taking unusually long - check TURN password / network' in popup, 'connection timeout hint missing'
          assert 'Must remain last. A callback reached from here may destroy the popup' in popup, 'popup post-dispatch lifetime guard missing'
          assert 'if (!this->isRunning() || !m_statusLabel) return;' in status, 'session status teardown guard missing'
          print('Multi-platform v0.5.3 final verification passed')
          PY

      - name: Build ${{ matrix.config.name }} for combine
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.7.1
          target: ${{ matrix.config.target }}
          build-config: Release
          android-min-sdk: 23
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          combine: true

  package:
    name: Combine Win64 + Android64
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Combine platform builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload unified .geode
        uses: actions/upload-artifact@v4
        with:
          name: lichigmdj.multiplayereditx-0.5.3-multiplatform
          path: ${{ steps.combine.outputs.build-output }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Multiplayer Edit X v0.5.3
          generate_release_notes: true
          files: ${{ steps.combine.outputs.build-output }}
