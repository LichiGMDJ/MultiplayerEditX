name: Build Multiplayer Edit X

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows64
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply test sync performance patch
        shell: bash
        run: python .ci/perf_sync_patch.py

      - name: Verify source architecture
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mod = json.loads(Path("mod.json").read_text(encoding="utf-8"))
          assert mod["geode"] == "5.9.0"
          assert mod["id"] == "lichigmdj.multiplayereditx"
          assert mod["version"] == "0.5.3"
          assert mod["settings"]["connection-mode"]["one-of"] == [
              "Auto", "WebRTC", "TURN", "HTTP Relay"
          ]

          p2p = Path("src/P2PManager.cpp").read_text(encoding="utf-8")
          p2ph = Path("src/P2PManager.hpp").read_text(encoding="utf-8")
          hooks = Path("src/EditorHooks.cpp").read_text(encoding="utf-8")
          remote = Path("src/RemoteActionHandler.cpp").read_text(encoding="utf-8")
          popup = Path("src/ui/MultiplayerPopup.cpp").read_text(encoding="utf-8")
          discovery = Path("src/ui/RoomDiscoveryPopups.cpp").read_text(encoding="utf-8")
          cursor = Path("src/ui/CursorNode.cpp").read_text(encoding="utf-8")
          cursor_h = Path("src/ui/CursorNode.hpp").read_text(encoding="utf-8")
          session = Path("src/SessionManager.cpp").read_text(encoding="utf-8")
          capabilities = Path("src/net/ProtocolCapabilities.hpp").read_text(encoding="utf-8")
          network = Path("src/net/NetworkConfig.hpp").read_text(encoding="utf-8")
          signaling = Path("server/signaling/server.ts").read_text(encoding="utf-8")

          # Protocol and transport architecture.
          assert "kCurrentProtocol = 8" in capabilities
          for token in [
              "ReliableAcks", "EditorLayers", "RawBulkPaste", "RoomSettings",
              "GlobalRevision", "TargetedRepair", "AdaptiveSync", "HostMigration",
              "SecureSignaling",
          ]:
              assert token in capabilities
          for token in [
              "ConnectionMode::Auto", "ConnectionMode::WebRTC",
              "ConnectionMode::Turn", "ConnectionMode::HttpRelay",
          ]:
              assert token in network
          assert "stable 0.5.0 WebRTC direct/STUN" in p2p
          assert "httpRelayPostInFlight" in p2ph
          assert "isOrderedReliableOpcode" in p2p
          assert "HTTP relay accepted reliable sequence" in p2p
          assert "checkPeerReady(fromId);" in p2p
          assert "checkPeerReady(playerId);" in p2p
          assert "signaling POST {} failed" in p2p
          assert "requestHostMigration" in p2p

          # Performance regression guards for this test build.
          assert "kMaxBulkPacketsPerPeerPerTick = 8" in p2p
          assert "std::chrono::seconds(3)" in p2p
          assert "queueInMainThread([this]() { flushBulkReliableQueues(); });" in p2p
          assert "queued authoritative snapshot immediately" in hooks
          assert "CCDelayTime::create(0.01f)" not in hooks
          assert "spawnedById" in remote
          assert "applyMs={}" in remote
          assert "fetchRooms(false);" in discovery
          assert "HOST_DIRECTORY_STALE_MS = 45_000" in signaling

          # Room discovery / privacy / password UI and API.
          for token in ["Public Rooms", "Private Room", "CreateRoomPopup", "RoomBrowserPopup"]:
              assert token in (popup + discovery), token
          for token in ["Password Required", "Room name", "Player limit", "hasPassword"]:
              assert token in discovery, token
          assert "constexpr int kDiscoveryButtonWidth = 176" in popup
          assert 'ButtonSprite::create("Public", 88' in discovery
          assert "serverLabel->setScale(0.62f)" in popup
          assert "patreon.com" not in popup.lower()
          assert "Patreon" not in popup
          assert not Path(".github/FUNDING.yml").exists()
          for token in [
              'req.method === "GET" && path === "/rooms"', "isPrivate", "passwordRequired",
              "playerLimit", "hasPassword", "roomName", "description",
          ]:
              assert token in signaling, token
          assert "directoryNow - room.host.lastSeenAt <= HOST_DIRECTORY_STALE_MS" in signaling
          assert "Explicit host leave/delete is authoritative" in signaling
          assert 'type: "client_left"' in signaling
          assert "signaling reports graceful leave for player" in p2p
          assert "Room closed by host" in p2p
          assert "Tell signaling first, while the peer connections are still alive." in p2p
          assert "Invalid room password" in p2p
          assert "m_pendingJoinPassword" in p2ph
          assert "unsafe popup owner access remains" not in discovery
          assert 'this->onClose(nullptr);\n    m_owner->' not in discovery

          # Session visuals and music metadata cleanup.
          assert "void clearRemoteVisuals();" in cursor_h
          assert "CursorNode: cleared all remote cursor/player visuals" in cursor
          assert "cursor->clearRemoteVisuals();" in session
          assert "RemoteActionHandler::get().clearMappings();" in session
          assert "resolveLevelMusicTitle" in hooks
          assert "level->getSongName()" in hooks
          assert "cursor music label resolved to" in hooks

          # Level/object synchronization must survive networking/UI refactors.
          for token in [
              "s_startPosObjects", "s_startPosSaveStrings", "m_objectID == 31",
              "encodeLayerTaggedUuid", "objectLayerSyncState",
              "serializeSyncLevelStart", "serializeSyncLevelChunk", "serializeSyncLevelEnd",
              "serializeBulkPasteStart", "serializeBulkPasteChunk", "serializeBulkPasteEnd",
              "serializePlaceObjects", "serializeDeleteObjects", "serializeMoveObjects",
              "serializeUpdateObjects", "serializeReconcileObjects", "AdaptiveSyncPolicy",
              "SYNC PERF",
          ]:
              assert token in hooks, token
          for token in [
              "decodeLayerTaggedUuid", "applyEditorLayers", "applyPendingSync",
              "InitialSyncRequest",
          ]:
              assert token in remote, token

          # Signaling v2 + selectable HTTP relay transport.
          assert "sessionToken" in signaling
          assert 'parts[2] === "migrate"' in signaling
          assert "transportMode" in signaling
          assert "RELAY_LONG_POLL_MS = 20_000" in signaling
          assert '["webrtc", "turn", "http-relay-v1"]' in signaling
          assert "sdpMid can legitimately be empty" in signaling
          assert "!candidate || !mid" not in signaling
          assert "194.226.126.115" not in p2p

          print("v0.5.3 performance + transport + room lifecycle + synchronization verification passed")
          PY

      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.9.0
          target: ${{ matrix.target }}
          build-config: Release
          android-min-sdk: 23
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          combine: true

  package:
    name: Package Win64 + Android64
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine builds
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichigmdj.multiplayereditx-0.5.3
          path: ${{ steps.combine.outputs.build-output }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Multiplayer Edit X v0.5.3
          generate_release_notes: true
          files: ${{ steps.combine.outputs.build-output }}
