name: Room Browser Cross Platform Build

on:
  push:
    branches:
      - v053-room-browser
    paths:
      - tools/room-browser-build.trigger

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v053-room-browser
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify signaling server
        run: deno check server/signaling/server.ts
      - name: Verify room browser invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          popup = Path('src/ui/MultiplayerPopup.cpp').read_text()
          discovery = Path('src/ui/RoomDiscoveryPopups.cpp').read_text()
          signaling = Path('server/signaling/server.ts').read_text()
          hooks = Path('src/EditorHooks.cpp').read_text()
          remote = Path('src/RemoteActionHandler.cpp').read_text()
          p2p = Path('src/P2PManager.cpp').read_text()
          for token in ['Public Rooms', 'Private Room', 'CreateRoomPopup', 'RoomBrowserPopup']:
              assert token in popup or token in discovery, token
          assert 'patreon.com' not in popup.lower()
          assert 'Patreon' not in popup
          for token in ['GET" && path === "/rooms"', 'isPrivate', 'passwordRequired', 'playerLimit']:
              assert token in signaling, token
          for token in ['s_startPosObjects', 'encodeLayerTaggedUuid', 'serializeSyncLevelStart', 'serializeSyncLevelChunk', 'serializeSyncLevelEnd']:
              assert token in hooks, token
          for token in ['decodeLayerTaggedUuid', 'applyEditorLayers', 'applyPendingSync']:
              assert token in remote, token
          for token in ['ConnectionMode::Auto', 'ConnectionMode::WebRTC', 'ConnectionMode::Turn', 'ConnectionMode::HttpRelay', 'isOrderedReliableOpcode']:
              assert token in (p2p + Path('src/net/NetworkConfig.hpp').read_text()), token
          print('room browser + sync invariants passed')
          PY

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows64
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v053-room-browser
      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.9.0
          target: ${{ matrix.target }}
          build-config: Release
          android-min-sdk: 23
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          combine: true

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Combine Win64 + Android64
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main
      - uses: actions/upload-artifact@v4
        with:
          name: lichigmdj.multiplayereditx-0.5.3-room-browser
          path: ${{ steps.combine.outputs.build-output }}
