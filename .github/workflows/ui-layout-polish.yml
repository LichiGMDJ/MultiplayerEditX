name: Apply Room UI Layout Polish

on:
  push:
    branches: [ui-layout-polish]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-layout-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-layout-polish
          fetch-depth: 0

      - name: Apply UI layout fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # Main connection/discovery screen.
          path = Path("src/ui/MultiplayerPopup.cpp")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '''        serverLabel->setScale(0.27f);\n        serverLabel->setPosition({center.width, center.height + 78.f});''',
              '''        // Keep the active signaling endpoint readable on desktop and mobile.\n        serverLabel->setScale(0.62f);\n        serverLabel->setPosition({center.width, center.height + 78.f});''',
              "signaling URL label"
          )

          old_buttons = '''            auto* browseSprite = ButtonSprite::create(\n                "Public Rooms", 135, true, "bigFont.fnt", "GJ_button_01.png", 30.f, 0.58f\n            );\n            auto* browseBtn = CCMenuItemSpriteExtra::create(\n                browseSprite, this, menu_selector(MultiplayerPopup::onBrowsePublic)\n            );\n            browseBtn->setPosition({center.width - 72.f, center.height + 10.f});\n            browseBtn->setID("public-rooms-button"_spr);\n            m_connectMenu->addChild(browseBtn);\n\n            auto* privateSprite = ButtonSprite::create(\n                "Private Room", 135, true, "bigFont.fnt", "GJ_button_05.png", 30.f, 0.58f\n            );\n            auto* privateBtn = CCMenuItemSpriteExtra::create(\n                privateSprite, this, menu_selector(MultiplayerPopup::onPrivateRoom)\n            );\n            privateBtn->setPosition({center.width + 72.f, center.height + 10.f});\n            privateBtn->setID("private-room-button"_spr);\n            m_connectMenu->addChild(privateBtn);\n\n            auto* hint = CCLabelBMFont::create(\n                "Public rooms are discovered from the Signaling Server URL in mod settings",\n                "chatFont.fnt"\n            );\n            hint->setScale(0.29f);\n            hint->setPosition({center.width, center.height - 38.f});'''

          new_buttons = '''            // Discovery actions are deliberately stacked: equal width, equal X,\n            // and enough vertical separation that their hitboxes never overlap.\n            constexpr int kDiscoveryButtonWidth = 176;\n            auto* browseSprite = ButtonSprite::create(\n                "Public Rooms", kDiscoveryButtonWidth, true, "bigFont.fnt", "GJ_button_01.png", 30.f, 0.58f\n            );\n            auto* browseBtn = CCMenuItemSpriteExtra::create(\n                browseSprite, this, menu_selector(MultiplayerPopup::onBrowsePublic)\n            );\n            browseBtn->setPosition({center.width, center.height + 18.f});\n            browseBtn->setID("public-rooms-button"_spr);\n            m_connectMenu->addChild(browseBtn);\n\n            auto* privateSprite = ButtonSprite::create(\n                "Private Room", kDiscoveryButtonWidth, true, "bigFont.fnt", "GJ_button_05.png", 30.f, 0.58f\n            );\n            auto* privateBtn = CCMenuItemSpriteExtra::create(\n                privateSprite, this, menu_selector(MultiplayerPopup::onPrivateRoom)\n            );\n            privateBtn->setPosition({center.width, center.height - 31.f});\n            privateBtn->setID("private-room-button"_spr);\n            m_connectMenu->addChild(privateBtn);\n\n            auto* hint = CCLabelBMFont::create(\n                "Rooms are loaded from the Signaling Server URL\\nselected in mod settings",\n                "chatFont.fnt"\n            );\n            hint->setScale(0.58f);\n            hint->setPosition({center.width, center.height - 78.f});'''

          text = replace_once(text, old_buttons, new_buttons, "stacked room buttons")
          text = replace_once(
              text,
              '''        m_statusLabel->setPosition({center.width, center.height - 88.f});''',
              '''        m_statusLabel->setPosition({center.width, 24.f});''',
              "connect status position"
          )
          path.write_text(text, encoding="utf-8")

          # Create-room and public-browser layout.
          path = Path("src/ui/RoomDiscoveryPopups.cpp")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              '''    makeLabel("Player limit", 0.4f, {center.width - 105.f, center.height - 10.f}, m_mainLayer);\n    m_limitInput = TextInput::create(54.f, "8", "chatFont.fnt");\n    m_limitInput->setPosition({center.width - 25.f, center.height - 10.f});''',
              '''    // Keep the whole row inside the same visual width as the 260px inputs above.\n    makeLabel("Player limit", 0.52f, {center.width - 102.f, center.height - 10.f}, m_mainLayer);\n    m_limitInput = TextInput::create(54.f, "8", "chatFont.fnt");\n    m_limitInput->setPosition({center.width - 25.f, center.height - 10.f});''',
              "player limit row"
          )
          text = replace_once(
              text,
              '''    m_visibilitySprite = ButtonSprite::create("Public", 105, true, "bigFont.fnt", "GJ_button_04.png", 28.f, 0.5f);''',
              '''    // 88px keeps Public/Private fully inside the 260px form column.\n    m_visibilitySprite = ButtonSprite::create("Public", 88, true, "bigFont.fnt", "GJ_button_04.png", 24.f, 0.46f);''',
              "visibility button width"
          )
          text = replace_once(
              text,
              '''    visibility->setPosition({center.width + 82.f, center.height - 10.f});''',
              '''    visibility->setPosition({center.width + 82.f, center.height - 10.f});''',
              "visibility button position"
          )
          text = replace_once(
              text,
              '''        "Private rooms are hidden from the public browser",\n        0.3f,\n        {center.width, 68.f},''',
              '''        "Private rooms are hidden\\nfrom the public browser",\n        0.56f,\n        {center.width, 70.f},''',
              "create room privacy hint"
          )

          # Room browser also had several nearly unreadable micro-labels.
          text = replace_once(
              text,
              '''    auto* serverLabel = makeLabel(P2PManager::getSignalingUrl().c_str(), 0.25f, {center.width, 255.f}, m_body);''',
              '''    auto* serverLabel = makeLabel(P2PManager::getSignalingUrl().c_str(), 0.48f, {center.width - 32.f, 255.f}, m_body);''',
              "browser server label"
          )
          text = replace_once(
              text,
              '''        auto* detailsLabel = makeLabel(details.c_str(), 0.25f, {48.f, y - 8.f}, m_body);''',
              '''        auto* detailsLabel = makeLabel(details.c_str(), 0.34f, {48.f, y - 8.f}, m_body);''',
              "browser detail label"
          )
          text = replace_once(
              text,
              '''    makeLabel(pageText.c_str(), 0.3f, {center.width, 32.f}, m_body);''',
              '''    makeLabel(pageText.c_str(), 0.42f, {center.width, 32.f}, m_body);''',
              "browser page label"
          )
          path.write_text(text, encoding="utf-8")

      - name: Validate UI invariants
        run: |
          grep -F 'constexpr int kDiscoveryButtonWidth = 176;' src/ui/MultiplayerPopup.cpp
          grep -F 'browseBtn->setPosition({center.width, center.height + 18.f});' src/ui/MultiplayerPopup.cpp
          grep -F 'privateBtn->setPosition({center.width, center.height - 31.f});' src/ui/MultiplayerPopup.cpp
          grep -F 'serverLabel->setScale(0.62f);' src/ui/MultiplayerPopup.cpp
          grep -F 'ButtonSprite::create("Public", 88' src/ui/RoomDiscoveryPopups.cpp
          grep -F 'Private rooms are hidden\\nfrom the public browser' src/ui/RoomDiscoveryPopups.cpp

      - name: Commit UI polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/MultiplayerPopup.cpp src/ui/RoomDiscoveryPopups.cpp
          git commit -m "ui: polish room discovery layouts [ui-layout-applied]"
          git push origin HEAD:ui-layout-polish
