name: v0.5.3 Connection Recovery

on:
  push:
    branches: [main]
    paths:
      - 'tools/v053_connection_recovery.py'
      - '.github/workflows/v053-connection-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply recovery patch
        run: python tools/v053_connection_recovery.py
      - name: Validate patch
        run: |
          grep -q 'makeRtcConfig(bool forceRelay)' src/P2PManager.cpp
          grep -q 'initial direct/STUN ICE failed; scheduling relay-only retry' src/P2PManager.cpp
          grep -q 'ignoring duplicate disconnect' src/P2PManager.cpp
          grep -q 'Signaling authentication failed' src/P2PManager.cpp
          ! grep -q 'client token required' server/signaling/server.ts
          ! grep -q 'host token required.*403' server/signaling/server.ts || true
      - name: Typecheck signaling
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check server/signaling/server.ts
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/P2PManager.cpp src/P2PManager.hpp server/signaling/server.ts
          git commit -m 'fix: recover failed ICE negotiation and signaling auth loops' || exit 0
          git push origin main
