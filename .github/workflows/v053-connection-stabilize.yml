name: v0.5.3 Connection Stabilization

on:
  push:
    branches: [main]
    paths:
      - 'tools/v053_connection_stabilize.py'
      - '.github/workflows/v053-connection-stabilize.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply connection stabilization
        run: python3 tools/v053_connection_stabilize.py

      - name: Validate patch markers
        run: |
          grep -q "remote ICE candidate from" src/P2PManager.cpp
          grep -q "skipping duplicate setLocalDescription" src/P2PManager.cpp
          grep -q "sdpMid can legitimately be empty" server/signaling/server.ts
          ! grep -q '!candidate || !mid' server/signaling/server.ts

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/P2PManager.cpp server/signaling/server.ts
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: stabilize ICE and signaling negotiation in 0.5.3"
          git push origin main
