name: v0.5.3 Host Negotiation Ordering

on:
  push:
    branches: [main]
    paths:
      - 'tools/v053_host_negotiation_order.py'
      - '.github/workflows/v053-host-negotiation-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply host negotiation ordering fix
        run: python3 tools/v053_host_negotiation_order.py
      - name: Validate ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/P2PManager.cpp').read_text()
          start = text.index('void P2PManager::createHostPeer')
          end = text.index('void P2PManager::finalizePeerHandshake', start)
          block = text[start:end]
          assert block.index('pc->onLocalCandidate') < block.index('pc->createDataChannel("reliable")')
          assert block.index('pc->onLocalDescription') < block.index('pc->createDataChannel("reliable")')
          assert block.index('m_peers[clientPlayerId]') < block.rindex('pc->setLocalDescription')
          print('host negotiation ordering verified')
          PY
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/P2PManager.cpp
          git commit -m "fix: register host ICE callbacks before negotiation"
          git push origin main
