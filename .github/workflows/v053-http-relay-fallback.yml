name: v0.5.3 HTTP Relay Fallback

on:
  push:
    branches: [main]
    paths:
      - 'tools/v053-http-relay.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix patch matcher for current leaveSession
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/v053_http_relay_fallback.py')
          s = p.read_text(encoding='utf-8')
          old = '''needle = ''' + "'''        stopSignalPolling();\n        m_signalingListener.cancel();\n'''" + '''\nreplacement = ''' + "'''        stopSignalPolling();\n        stopHttpRelayPolling();\n        m_signalingListener.cancel();\n'''" + '''\nif needle not in cpp:\n    raise SystemExit('leaveSession stop insertion point missing')\ncpp = cpp.replace(needle, replacement, 1)'''
          new = '''needle = ''' + "'''    void P2PManager::leaveSession() {\n        stopSignalPolling();\n'''" + '''\nreplacement = ''' + "'''    void P2PManager::leaveSession() {\n        stopSignalPolling();\n        stopHttpRelayPolling();\n'''" + '''\nif needle not in cpp:\n    raise SystemExit('leaveSession stop insertion point missing')\ncpp = cpp.replace(needle, replacement, 1)'''
          if old not in s:
              raise SystemExit('patch-tool matcher block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply HTTP relay transport patch
        run: python tools/v053_http_relay_fallback.py
      - name: Validate source changes
        run: |
          grep -q 'HTTP relay fallback available' src/P2PManager.cpp
          grep -q 'sendHttpRelayPacket' src/P2PManager.cpp
          grep -q 'httpRelay' src/P2PManager.hpp
          grep -q 'http-relay-v1' server/signaling/server.ts
          grep -q 'parts\[2\] === "relay"' server/signaling/server.ts
          ! grep -q 'openrelay.metered.ca' src/P2PManager.cpp
      - name: Type-check signaling server
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check server/signaling/server.ts
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/P2PManager.cpp src/P2PManager.hpp server/signaling/server.ts
          git commit -m 'feat: add authenticated HTTP relay transport fallback' || exit 0
          git push origin main
