name: v0.5.3 Legacy Relay Compatibility

on:
  push:
    branches: [main]
    paths:
      - 'tools/v053-legacy-relay.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply relay compatibility patch
        run: python tools/v053_legacy_relay_compat.py
      - name: Validate relay configuration
        run: |
          grep -q 'openrelay.metered.ca' src/P2PManager.cpp
          grep -q 'RelayType::TurnTcp' src/P2PManager.cpp
          grep -q 'compatibility TURN/TCP fallback available' src/P2PManager.cpp
          grep -q 'custom TURN/UDP + compatibility TURN/TCP fallback available' src/P2PManager.cpp
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/P2PManager.cpp
          git commit -m 'fix: restore transparent 0.5.2-style relay fallback' || exit 0
          git push origin main
