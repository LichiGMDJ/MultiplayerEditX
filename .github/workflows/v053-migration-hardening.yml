name: Harden v0.5.3 host migration

on:
  push:
    branches:
      - mod-id-lichigmdj
    paths:
      - .github/workflows/v053-migration-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hardening
        run: python3 tools/v053_migration_hardening.py

      - name: Validate
        run: |
          grep -q 'Authorization.*Bearer' src/P2PManager.cpp
          grep -q 'requestedGeneration < room.generation' server/signaling/server.ts
          if grep -q 'migratedFromHost' server/signaling/server.ts; then exit 1; fi

      - name: Commit source only
        run: |
          git config user.name 'LichiGMDJ'
          git config user.email 'aleksandrrubacev222@gmail.com'
          git add src/P2PManager.cpp server/signaling/server.ts
          git commit -m 'Harden repeatable host migration'
          git push origin HEAD:mod-id-lichigmdj
