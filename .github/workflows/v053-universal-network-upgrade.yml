name: Integrate v0.5.3 Universal Networking

on:
  push:
    branches: [mod-id-lichigmdj]
    paths: [.github/workflows/v053-universal-network-upgrade.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate architecture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: anchor not found")
              return text.replace(old, new, 1)

          # ---------------- BinaryProtocol: capability-bearing hello ----------------
          hpp_path = Path('src/BinaryProtocol.hpp')
          hpp = hpp_path.read_text()
          hpp = once(
              hpp,
              '    std::vector<uint8_t> serializeProtocolHello(uint32_t protocolVersion);',
              '    std::vector<uint8_t> serializeProtocolHello(uint32_t protocolVersion, uint64_t capabilities);',
              'protocol hello declaration'
          )
          hpp = once(
              hpp,
              '''    struct ProtocolHelloMsg {\n        uint32_t protocolVersion = 0;\n    };''',
              '''    struct ProtocolHelloMsg {\n        uint32_t protocolVersion = 0;\n        uint64_t capabilities = 0;\n    };''',
              'protocol hello struct'
          )
          hpp_path.write_text(hpp)

          cpp_path = Path('src/BinaryProtocol.cpp')
          cpp = cpp_path.read_text()
          cpp = once(
              cpp,
              '''    std::vector<uint8_t> serializeProtocolHello(uint32_t protocolVersion) {\n        Writer w;\n        w.writeOpcode(Opcode::ProtocolHello);\n        w.writeVarInt(protocolVersion);\n        return std::move(w.takeData());\n    }''',
              '''    std::vector<uint8_t> serializeProtocolHello(uint32_t protocolVersion, uint64_t capabilities) {\n        Writer w;\n        w.writeOpcode(Opcode::ProtocolHello);\n        w.writeVarInt(protocolVersion);\n        w.writeU32(static_cast<uint32_t>(capabilities & 0xffffffffull));\n        w.writeU32(static_cast<uint32_t>(capabilities >> 32));\n        return std::move(w.takeData());\n    }''',
              'protocol hello serializer'
          )
          cpp = once(
              cpp,
              '''    ProtocolHelloMsg deserializeProtocolHello(Reader& r) {\n        ProtocolHelloMsg msg;\n        msg.protocolVersion = r.readVarInt();\n        return msg;\n    }''',
              '''    ProtocolHelloMsg deserializeProtocolHello(Reader& r) {\n        ProtocolHelloMsg msg;\n        msg.protocolVersion = r.readVarInt();\n        // v7 sent only the version. v8+ appends a 64-bit capability mask.\n        if (r.remaining() >= 8) {\n            uint64_t low = r.readU32();\n            uint64_t high = r.readU32();\n            msg.capabilities = low | (high << 32);\n        }\n        return msg;\n    }''',
              'protocol hello deserializer'
          )
          cpp_path.write_text(cpp)

          # ---------------- P2PManager public model ----------------
          p2p_hpp_path = Path('src/P2PManager.hpp')
          p2p_hpp = p2p_hpp_path.read_text()
          p2p_hpp = once(p2p_hpp, '#include "BinaryProtocol.hpp"\n', '#include "BinaryProtocol.hpp"\n#include "net/ProtocolCapabilities.hpp"\n', 'p2p capability include')
          p2p_hpp = once(
              p2p_hpp,
              '''        bool isPeerReconnect(int playerId);\n        uint32_t getGlobalRevision() const { return m_globalRevision.load(); }''',
              '''        bool isPeerReconnect(int playerId);\n        bool supportsCapability(int playerId, net::Capability capability);\n        std::size_t getTotalReliableQueueDepth();\n        uint32_t getGlobalRevision() const { return m_globalRevision.load(); }''',
              'p2p diagnostics api'
          )
          p2p_hpp = once(
              p2p_hpp,
              '''            uint32_t protocolVersion = 0;\n            std::vector<std::vector<uint8_t>> preHandshakeMessages;''',
              '''            uint32_t protocolVersion = 0;\n            uint64_t capabilities = 0;\n            std::vector<std::vector<uint8_t>> preHandshakeMessages;''',
              'peer capabilities'
          )
          p2p_hpp = once(
              p2p_hpp,
              '''        void flushBulkReliableQueues();\n        void scheduleClientReconnect();''',
              '''        void flushBulkReliableQueues();\n        void requestHostMigration();\n        void becomeMigratedHost(std::string const& token, uint32_t generation);\n        void scheduleClientReconnect();''',
              'migration methods'
          )
          p2p_hpp = once(
              p2p_hpp,
              '''        geode::async::TaskHolder<geode::utils::web::WebResponse> m_signalingListener;  // room create/join\n        geode::async::TaskHolder<geode::utils::web::WebResponse> m_signalPollListener; // long-poll loop\n        std::atomic<bool> m_signalingActive{false};\n        std::string m_signalingRoomId;   // server-side room ID''',
              '''        geode::async::TaskHolder<geode::utils::web::WebResponse> m_signalingListener;  // room create/join\n        geode::async::TaskHolder<geode::utils::web::WebResponse> m_signalPollListener; // long-poll loop\n        geode::async::TaskHolder<geode::utils::web::WebResponse> m_migrationListener;\n        std::atomic<bool> m_signalingActive{false};\n        std::atomic<bool> m_hostMigrationAvailable{false};\n        std::string m_signalingRoomId;   // server-side room ID\n        std::string m_signalingToken;\n        uint32_t m_signalingGeneration = 0;\n        uint32_t m_signalingApi = 1;''',
              'signaling security state'
          )
          p2p_hpp_path.write_text(p2p_hpp)

          p2p_path = Path('src/P2PManager.cpp')
          p2p = p2p_path.read_text()
          p2p = once(
              p2p,
              '#include "BinaryProtocol.hpp"\n',
              '#include "BinaryProtocol.hpp"\n#include "net/NetworkConfig.hpp"\n#include "net/ProtocolCapabilities.hpp"\n#include "sync/SyncMetrics.hpp"\n',
              'p2p architecture includes'
          )
          p2p = p2p.replace('        constexpr uint32_t kProtocolVersion = 7;\n\n', '', 1)

          # Replace configuration functions as a unit: C++ contains no endpoint IPs.
          start = p2p.index('    rtc::Configuration P2PManager::makeRtcConfig() {')
          end = p2p.index('    P2PManager::State P2PManager::getState() const {', start)
          p2p = p2p[:start] + '''    rtc::Configuration P2PManager::makeRtcConfig() {\n        rtc::Configuration config;\n        config.iceServers.push_back({"stun:stun.l.google.com:19302"});\n        config.iceServers.push_back({"stun:stun.cloudflare.com:3478"});\n\n        auto network = net::NetworkConfig::load();\n        if (network.hasTurn()) {\n            rtc::IceServer turn(\n                network.turnHost,\n                3478,\n                network.turnUsername,\n                network.turnPassword,\n                rtc::IceServer::RelayType::TurnUdp\n            );\n            config.iceServers.push_back(turn);\n\n            if (network.forceTurnRelay) {\n                config.iceTransportPolicy = rtc::TransportPolicy::Relay;\n                log::warn("P2PManager: Force TURN diagnostic mode enabled");\n            } else {\n                log::info("P2PManager: ICE auto mode: direct/STUN preferred, TURN fallback available");\n            }\n        } else {\n            log::info("P2PManager: ICE direct/STUN mode; TURN is not configured");\n        }\n        return config;\n    }\n\n    std::string P2PManager::getSignalingUrl() {\n        return net::NetworkConfig::load().signalingUrl;\n    }\n\n\n\n''' + p2p[end:]

          p2p = once(
              p2p,
              '''    std::string P2PManager::getError() const {\n        std::lock_guard lock(m_stateMutex);\n        return m_error;\n    }''',
              '''    std::string P2PManager::getError() const {\n        std::lock_guard lock(m_stateMutex);\n        return m_error;\n    }\n\n    bool P2PManager::supportsCapability(int playerId, net::Capability capability) {\n        std::lock_guard lock(m_peersMutex);\n        auto it = m_peers.find(playerId);\n        return it != m_peers.end() && net::hasCapability(it->second.capabilities, capability);\n    }\n\n    std::size_t P2PManager::getTotalReliableQueueDepth() {\n        std::lock_guard lock(m_peersMutex);\n        std::size_t depth = 0;\n        for (auto const& [id, peer] : m_peers) {\n            (void)id;\n            depth += peer.bulkReliableQueue.size();\n        }\n        return depth;\n    }''',
              'p2p diagnostics implementation'
          )

          old_handshake = '''            auto hello = proto::deserializeProtocolHello(helloReader);\n            if (helloReader.hasError() || hello.protocolVersion != kProtocolVersion) {\n                log::warn(\n                    "P2PManager: incompatible protocol from player {} (remote={}, local={})",\n                    fromPlayerId,\n                    hello.protocolVersion,\n                    kProtocolVersion\n                );\n\n                auto errorMsg = proto::serializeError(\n                    "Incompatible Multiplayer Edit protocol. Both players must use v0.5.1 or newer compatible builds."\n                );'''
          new_handshake = '''            auto hello = proto::deserializeProtocolHello(helloReader);\n            auto remoteCapabilities = net::normalizeCapabilities(hello.protocolVersion, hello.capabilities);\n            if (helloReader.hasError() || !net::isCompatible(hello.protocolVersion, remoteCapabilities)) {\n                log::warn(\n                    "P2PManager: incompatible peer {} (protocol={}, capabilities={}, localProtocol={})",\n                    fromPlayerId,\n                    hello.protocolVersion,\n                    remoteCapabilities,\n                    net::kCurrentProtocol\n                );\n\n                auto errorMsg = proto::serializeError(\n                    "Incompatible Multiplayer Edit capabilities"\n                );'''
          p2p = once(p2p, old_handshake, new_handshake, 'capability handshake')
          p2p = once(
              p2p,
              '''                    it->second.protocolVerified = true;\n                    it->second.protocolVersion = hello.protocolVersion;''',
              '''                    it->second.protocolVerified = true;\n                    it->second.protocolVersion = hello.protocolVersion;\n                    it->second.capabilities = remoteCapabilities;\n                    if (m_role == Role::Client && fromPlayerId == 0) {\n                        m_hostMigrationAvailable.store(\n                            net::hasCapability(remoteCapabilities, net::Capability::HostMigration)\n                        );\n                    }''',
              'store peer capabilities'
          )
          p2p = p2p.replace(
              'proto::serializeProtocolHello(kProtocolVersion)',
              'proto::serializeProtocolHello(net::kCurrentProtocol, net::kLocalCapabilities)'
          )

          # Count network volume without re-deserializing object messages.
          p2p = once(
              p2p,
              '''    void P2PManager::sendTo(int playerId, std::vector<uint8_t> const& data, ChannelType channel) {\n        std::lock_guard lock(m_peersMutex);''',
              '''    void P2PManager::sendTo(int playerId, std::vector<uint8_t> const& data, ChannelType channel) {\n        sync::SyncMetrics::get().recordOutboundBytes(data.size());\n        std::lock_guard lock(m_peersMutex);''',
              'outbound metrics'
          )

          # Secure signaling metadata is optional, preserving compatibility with the old server.
          p2p = once(
              p2p,
              '''        body["playerName"] = playerName;\n        req.bodyJSON(body);''',
              '''        body["playerName"] = playerName;\n        body["protocol"] = static_cast<int>(net::kCurrentProtocol);\n        body["capabilities"] = static_cast<double>(net::kLocalCapabilities);\n        req.bodyJSON(body);''',
              'create signaling metadata'
          )
          p2p = once(
              p2p,
              '''                    m_signalingRoomId = json.get<std::string>("roomId").unwrapOr("");''',
              '''                    m_signalingRoomId = json.get<std::string>("roomId").unwrapOr("");\n                    m_signalingToken = json.get<std::string>("sessionToken").unwrapOr("");\n                    m_signalingGeneration = static_cast<uint32_t>(json.get<int>("generation").unwrapOr(0));\n                    m_signalingApi = static_cast<uint32_t>(json.get<int>("signalingApi").unwrapOr(1));''',
              'create token response'
          )

          # Long poll authorization.
          poll_anchor = '''        auto req = web::WebRequest();\n        req.timeout(std::chrono::seconds(30));'''
          poll_new = '''        auto req = web::WebRequest();\n        if (!m_signalingToken.empty()) {\n            req.header("Authorization", "Bearer " + m_signalingToken);\n        }\n        req.timeout(std::chrono::seconds(30));'''
          p2p = once(p2p, poll_anchor, poll_new, 'poll bearer auth')

          p2p = once(
              p2p,
              '''        auto req = web::WebRequest();\n        req.header("Content-Type", "application/json");\n        req.bodyJSON(msg);\n        async::spawn(req.post(url));''',
              '''        auto req = web::WebRequest();\n        req.header("Content-Type", "application/json");\n        if (!m_signalingToken.empty()) {\n            req.header("Authorization", "Bearer " + m_signalingToken);\n        }\n        req.bodyJSON(msg);\n        async::spawn(req.post(url));''',
              'signal post bearer auth'
          )

          # Join request metadata: replace the second playerName request body occurrence.
          join_marker = '    void P2PManager::signalingJoinRoom(std::string const& roomCode, std::string const& playerName) {'
          join_at = p2p.index(join_marker)
          join_tail = p2p[join_at:]
          join_tail = once(
              join_tail,
              '''        body["playerName"] = playerName;\n        req.bodyJSON(body);''',
              '''        body["playerName"] = playerName;\n        body["protocol"] = static_cast<int>(net::kCurrentProtocol);\n        body["capabilities"] = static_cast<double>(net::kLocalCapabilities);\n        req.bodyJSON(body);''',
              'join signaling metadata'
          )
          join_tail = once(
              join_tail,
              '''                    m_localPlayerId = json.get<int>("playerId").unwrapOr(-1);\n                    auto hostName = json.get<std::string>("hostName").unwrapOr("Host");''',
              '''                    m_localPlayerId = json.get<int>("playerId").unwrapOr(-1);\n                    auto hostName = json.get<std::string>("hostName").unwrapOr("Host");\n                    m_signalingToken = json.get<std::string>("sessionToken").unwrapOr(m_signalingToken);\n                    m_signalingGeneration = static_cast<uint32_t>(json.get<int>("generation").unwrapOr(static_cast<int>(m_signalingGeneration)));\n                    m_signalingApi = static_cast<uint32_t>(json.get<int>("signalingApi").unwrapOr(static_cast<int>(m_signalingApi)));''',
              'join token response'
          )
          p2p = p2p[:join_at] + join_tail

          # Prefer migration when the disconnected host advertised it and secure signaling is active.
          p2p = once(
              p2p,
              '''                if (unexpected) {\n                    m_state.store(State::Reconnecting);\n                    scheduleClientReconnect();\n                    return;\n                }''',
              '''                if (unexpected) {\n                    m_state.store(State::Reconnecting);\n                    if (m_hostMigrationAvailable.load() && !m_signalingToken.empty()) {\n                        requestHostMigration();\n                    } else {\n                        scheduleClientReconnect();\n                    }\n                    return;\n                }''',
              'host loss migration path'
          )

          migration_impl = r'''    void P2PManager::requestHostMigration() {
        if (m_role != Role::Client || m_roomCode.empty() || m_signalingToken.empty()) {
            scheduleClientReconnect();
            return;
        }

        auto url = getSignalingUrl() + "/rooms/" + m_roomCode + "/migrate";
        auto req = web::WebRequest();
        req.header("Content-Type", "application/json");
        req.header("Authorization", "Bearer " + m_signalingToken);
        auto body = matjson::Value();
        body["generation"] = static_cast<int>(m_signalingGeneration);
        body["playerName"] = m_localPlayerName;
        req.bodyJSON(body);

        log::warn("P2PManager: host lost; requesting signaling-assisted migration (generation={})", m_signalingGeneration);
        m_migrationListener.spawn(
            req.post(url),
            [this](web::WebResponse res) {
                if (m_role != Role::Client || m_state.load() != State::Reconnecting) return;

                if (!res.ok()) {
                    log::warn("P2PManager: migration endpoint returned {}; falling back to reconnect", res.code());
                    scheduleClientReconnect();
                    return;
                }

                auto json = res.json().unwrapOr(matjson::Value());
                auto role = json.get<std::string>("role").unwrapOr("client");
                auto generation = static_cast<uint32_t>(json.get<int>("generation").unwrapOr(static_cast<int>(m_signalingGeneration)));
                m_signalingGeneration = generation;

                if (role == "host") {
                    auto token = json.get<std::string>("sessionToken").unwrapOr(m_signalingToken);
                    becomeMigratedHost(token, generation);
                    return;
                }

                // A deterministic lower-ID peer was elected. Rejoin the same room
                // after it starts host polling; reconnect already provides bounded backoff.
                scheduleClientReconnect();
            }
        );
    }

    void P2PManager::becomeMigratedHost(std::string const& token, uint32_t generation) {
        stopSignalPolling();
        {
            std::lock_guard lock(m_peersMutex);
            for (auto& [id, peer] : m_peers) {
                (void)id;
                if (peer.reliable) peer.reliable->close();
                if (peer.unreliable) peer.unreliable->close();
                if (peer.pc) peer.pc->close();
            }
            m_peers.clear();
        }

        {
            std::lock_guard lock(m_stateMutex);
            m_role = Role::Host;
            m_localPlayerId = 0;
        }
        m_signalingToken = token;
        m_signalingGeneration = generation;
        m_nextPlayerId = 1;
        m_reconnectAttempts = 0;
        m_reconnectScheduled.store(false);
        m_hostMigrationAvailable.store(false);
        m_state.store(State::Connected);

        auto room = getRoomCode();
        startSignalPolling(room, "host", 0);
        log::info("P2PManager: promoted to host for room {} generation {}", room, generation);

        queueInMainThread([this, room]() {
            for (auto& cb : m_onSessionStarted) {
                cb(room, 0);
            }
        });
    }

'''
          schedule_anchor = '    void P2PManager::scheduleClientReconnect() {'
          p2p = once(p2p, schedule_anchor, migration_impl + schedule_anchor, 'migration implementation')

          # Host leave is authenticated; v2 server migrates instead of deleting when peers remain.
          p2p = once(
              p2p,
              '''            auto req = web::WebRequest();\n            async::spawn(req.send("DELETE", url));''',
              '''            auto req = web::WebRequest();\n            if (!m_signalingToken.empty()) {\n                req.header("Authorization", "Bearer " + m_signalingToken);\n            }\n            async::spawn(req.send("DELETE", url));''',
              'authenticated host leave'
          )
          p2p = once(
              p2p,
              '''        m_signalingRoomId.clear();\n\n        log::info("P2PManager: Session ended");''',
              '''        m_signalingRoomId.clear();\n        m_signalingToken.clear();\n        m_signalingGeneration = 0;\n        m_signalingApi = 1;\n        m_hostMigrationAvailable.store(false);\n\n        log::info("P2PManager: Session ended");''',
              'clear signaling security state'
          )
          p2p_path.write_text(p2p)

          # ---------------- Serializer metrics ----------------
          action_path = Path('src/ActionSerializer.cpp')
          action = action_path.read_text()
          action = once(action, '#include "ActionSerializer.hpp"\n', '#include "ActionSerializer.hpp"\n#include "sync/SyncMetrics.hpp"\n', 'serializer metrics include')
          action = once(
              action,
              '''        if (!obj) return data;\n\n        data.objectID = obj->m_objectID;''',
              '''        if (!obj) return data;\n        sync::SyncMetrics::get().recordSerializedObjects(1);\n\n        data.objectID = obj->m_objectID;''',
              'serializer metrics count'
          )
          action_path.write_text(action)

          # ---------------- Adaptive editor policy ----------------
          hooks_path = Path('src/EditorHooks.cpp')
          hooks = hooks_path.read_text()
          hooks = once(
              hooks,
              '#include "ui/UpdateHelperNode.hpp"\n',
              '#include "ui/UpdateHelperNode.hpp"\n#include "sync/AdaptiveSyncPolicy.hpp"\n#include "sync/SyncMetrics.hpp"\n',
              'adaptive sync includes'
          )
          hooks = once(
              hooks,
              '        float m_externalCompatScanTimer = 0.f;',
              '        float m_externalCompatScanTimer = 0.f;\n        float m_syncMetricsTimer = 0.f;',
              'metrics timer field'
          )
          hooks = once(
              hooks,
              '''        uint32_t totalChunks = static_cast<uint32_t>(chunks.size());\n        uint32_t totalObjects = static_cast<uint32_t>(allUuids.size());''',
              '''        uint32_t totalChunks = static_cast<uint32_t>(chunks.size());\n        uint32_t totalObjects = static_cast<uint32_t>(allUuids.size());\n        sync::SyncMetrics::get().recordSerializedObjects(totalObjects);\n        sync::SyncMetrics::get().recordOutboundBytes(compressedBytes.size());\n        if (totalObjects >= sync::AdaptiveSyncPolicy::fullSnapshotWarningThreshold()) {\n            log::warn("EditorHooks: large authoritative snapshot: {} objects, {} compressed bytes", totalObjects, compressedBytes.size());\n        }''',
              'full snapshot metrics'
          )

          old_integrity = '''        m_fields->m_integrityCheckTimer += dt;\n        if (\n            session.getRole() == SessionManager::Role::Client &&\n            handler.isInitialSyncCompleted() &&\n            !handler.isProcessingRemote() &&\n            (m_fields->m_forceIntegrityCheck || m_fields->m_integrityCheckTimer >= 20.0f)\n        ) {\n            m_fields->m_integrityCheckTimer = 0.f;\n            m_fields->m_forceIntegrityCheck = false;\n            handler.sendLevelDigestTo(0);\n        }'''
          new_integrity = '''        m_fields->m_integrityCheckTimer += dt;\n        std::size_t liveObjectCount = this->m_objects ? this->m_objects->count() : 0;\n        float integrityInterval = sync::AdaptiveSyncPolicy::integrityIntervalSeconds(liveObjectCount);\n        bool periodicIntegrityDue =\n            sync::AdaptiveSyncPolicy::periodicIntegrityEnabled(liveObjectCount) &&\n            m_fields->m_integrityCheckTimer >= integrityInterval;\n        if (\n            session.getRole() == SessionManager::Role::Client &&\n            handler.isInitialSyncCompleted() &&\n            !handler.isProcessingRemote() &&\n            (m_fields->m_forceIntegrityCheck || periodicIntegrityDue)\n        ) {\n            m_fields->m_integrityCheckTimer = 0.f;\n            m_fields->m_forceIntegrityCheck = false;\n            handler.sendLevelDigestTo(0);\n        }'''
          hooks = once(hooks, old_integrity, new_integrity, 'adaptive integrity cadence')
          hooks = once(
              hooks,
              '''            m_fields->m_externalCompatScanTimer >= 0.25f &&\n            !isPlaytesting &&''',
              '''            m_fields->m_externalCompatScanTimer >=\n                sync::AdaptiveSyncPolicy::externalCompatibilityScanIntervalSeconds(liveObjectCount) &&\n            !isPlaytesting &&''',
              'adaptive compatibility scan'
          )
          metrics_anchor = '''        // Send cursor position periodically\n        m_fields->m_cursorSendTimer += dt;'''
          metrics_block = '''        m_fields->m_syncMetricsTimer += dt;\n        if (m_fields->m_syncMetricsTimer >= 5.f) {\n            m_fields->m_syncMetricsTimer = 0.f;\n            auto& metrics = sync::SyncMetrics::get();\n            metrics.setReliableQueueDepth(P2PManager::get().getTotalReliableQueueDepth());\n            auto sample = metrics.sample();\n            log::info(\n                "SYNC PERF objects/s={} bytes/s={} reliableQueue={} objectsTotal={} bytesTotal={}",\n                sample.objectsPerSecond, sample.bytesPerSecond, sample.reliableQueueDepth,\n                sample.totalObjectsSerialized, sample.totalBytesQueued\n            );\n        }\n\n        // Send cursor position periodically\n        m_fields->m_cursorSendTimer += dt;'''
          hooks = once(hooks, metrics_anchor, metrics_block, 'sync metrics log')
          hooks_path.write_text(hooks)

          # CMake project metadata follows mod.json.
          cmake_path = Path('CMakeLists.txt')
          cmake = cmake_path.read_text().replace('project(MultiplayerEdit VERSION 0.5.1)', 'project(MultiplayerEdit VERSION 0.5.3)', 1)
          cmake_path.write_text(cmake)

          # CI verifies architecture, not patch markers.
          workflow_path = Path('.github/workflows/multi-platform-release.yml')
          wf = workflow_path.read_text()
          wf = wf.replace('assert "kProtocolVersion = 7" in p2p', 'assert "net::kCurrentProtocol" in p2p')
          wf = once(
              wf,
              '''          assert "applyEditorLayers(match, tagged.layer1, tagged.layer2)" in remote\n''',
              '''          assert "applyEditorLayers(match, tagged.layer1, tagged.layer2)" in remote\n          capabilities = Path("src/net/ProtocolCapabilities.hpp").read_text(encoding="utf-8")\n          adaptive = Path("src/sync/AdaptiveSyncPolicy.hpp").read_text(encoding="utf-8")\n          signaling = Path("server/signaling/server.ts").read_text(encoding="utf-8")\n          assert "kCurrentProtocol = 8" in capabilities\n          assert "HostMigration" in capabilities and "AdaptiveSync" in capabilities\n          assert "periodicIntegrityEnabled" in adaptive\n          assert "sessionToken" in signaling and "/migrate" in signaling\n          assert "194.226.126.115" not in p2p\n''',
              'workflow architecture checks'
          )
          workflow_path.write_text(wf)

          # The integration workflow is intentionally one-shot.
          Path('.github/workflows/v053-universal-network-upgrade.yml').unlink()
          PY

      - name: Validate integration
        shell: bash
        run: |
          grep -q 'kCurrentProtocol = 8' src/net/ProtocolCapabilities.hpp
          grep -q 'requestHostMigration' src/P2PManager.cpp
          grep -q 'AdaptiveSyncPolicy' src/EditorHooks.cpp
          grep -q 'sessionToken' server/signaling/server.ts
          ! grep -q '194.226.126.115' src/P2PManager.cpp

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name 'LichiGMDJ'
          git config user.email 'aleksandrrubacev222@gmail.com'
          git add -A
          git commit -m 'Integrate v0.5.3 universal networking architecture'
          git push origin HEAD:mod-id-lichigmdj
